# Copy to intents/<id>-<slug>/metadata.yml. Format is flat on purpose —
# scripts/intent-check-lib.mjs parses it without a YAML dependency.
id: 0
slug: short-kebab-name
type: feature            # feature | fix | refactor | adjustment | experiment
status: draft            # draft | accepted | in-progress | in-review | done | abandoned | deferred
title: One-line title as `npm run queue` prints it
review_tier:             # empty = REVIEW-POLICY.md's path table decides; set only to raise it (attested | reviewed)
# Gates: the date you passed each one (a bare date), or `<date> by-agent` when
# an agent recorded it on your request. Leave empty until passed.
intent_accepted:
spec_accepted:           # feature only
plan_approved:           # feature, fix, refactor
live_checked:            # only when review.md says live-check: owed — the day you ran it yourself
merged:                  # merge commit hash
auto_authorized:         # /auto only: the date the owner typed /auto <id> (a bare date, or `<date> by-agent`); NOT a gate
auto_round:              # /auto only: the review round a stopped run is in, 1 to 3
auto_stopped:            # /auto only: why it stopped, written without ` #`; cleared on resume
follows_up:              # fix only: id of the intent whose change caused this defect, if known
links:
  # - intents/1-stack-and-skeleton    related intent
