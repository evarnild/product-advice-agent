[project]
name = "product-advice-agent"
version = "0.1.0"
description = "A small product-advice agent for a synthetic electronics catalogue."
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "langfuse",
    "python-dotenv",
    "httpx",
    "python-fasthtml==0.14.14",
]

[project.scripts]
advisor = "advisor.cli:main"
advisor-eval = "advisor.evals.run:main"
advisor-analysis = "advisor.evals.analysis:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "opentelemetry-sdk",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/advisor"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
files = ["src/advisor"]
strict = true

[[tool.mypy.overrides]]
# FastHTML ships no type information (§9); only the viewer module imports it.
module = ["fasthtml", "fasthtml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
